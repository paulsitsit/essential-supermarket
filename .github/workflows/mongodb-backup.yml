name: MongoDB Atlas Backup

on:
  schedule:
    # Runs every day at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MongoDB Database Tools
        run: |
          curl -fsSL https://www.mongodb.com/static/cli/mongo-database-tools/latest/mongodb-database-tools-ubuntu2204-x86_64-latest.tgz \
            -o mongodb-tools.tgz
          tar -xzf mongodb-tools.tgz
          sudo mv mongodb-database-tools-*/bin/* /usr/local/bin/
          rm -rf mongodb-tools.tgz mongodb-database-tools-*

      - name: Verify mongodump
        run: mongodump --version

      - name: Create backup directory
        run: mkdir -p backups

      - name: Run mongodump
        env:
          MONGODB_BACKUP_URI: ${{ secrets.MONGODB_BACKUP_URI }}
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          ARCHIVE="backups/essential-supermarket_${TIMESTAMP}.archive.gz"

          mongodump \
            --uri="$MONGODB_BACKUP_URI" \
            --archive="$ARCHIVE" \
            --gzip

          if [ ! -f "$ARCHIVE" ]; then
            echo "Backup failed: archive file was not created."
            exit 1
          fi

          if [ ! -s "$ARCHIVE" ]; then
            echo "Backup failed: archive file is empty."
            exit 1
          fi

          echo "Backup created: $ARCHIVE"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup
          path: backups/*.archive.gz
          retention-days: 30
